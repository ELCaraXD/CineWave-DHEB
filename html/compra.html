<html>
    <head>
        <title>Registrar</title>
    
        <style>
            @font-face {
                font-family: 'Decohead'; 
                src: url('fonts/DecoheadFREE.otf') format('opentype'); 
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'Aliens'; 
                src: url('fonts/AliensAmongUs.otf') format('opentype');  
                font-weight: normal;
                font-style: normal;
            }

            body{
                font-family: 'Aliens';

                min-height: 100vh;
                background-image: url('imgGe/backlo.png');
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
                
                color: black;
                margin: 0;
            }
            #login{
                position: absolute;
                top: 4%;
                right: 5%;

                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;

                font-size: 13px;
                
                border: 8px;
                border-color: black;
                border-style: double;
                border-radius: 40px;

                box-shadow: 5px 5px 10px black;

                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;

                width: 20%;
                height: 90%;
                
                background-color: transparent;

            }
            .bot{
                font-family: 'Decohead';
                font-size: 25px;

                width: 50%;
                height: 15%;

                border: 3px;
                border-color: black;
                border-radius: 0px 10px 10px 0px;
                border-style: hidden hidden hidden solid;

                background-color: transparent;
                box-shadow: 3px 3px 7px black;

                margin-top: 5%;

                transition: width 1s;
            }
            .bot:hover{
                width: 80%;
            }
            input[type=text] {
                font-size: 10px;

                width: 40%;
                height: 5%;

                padding: 12px;
                
                margin: 8px 0;

                box-shadow: 2px 2px 5px black;
                
                display: inline-block;
                
                border: 3px;
                border-style: hidden hidden hidden solid;
                border-color: black;
                border-radius: 3px;
                
                box-sizing: border-box;

                transition: width 1s;
            }
            input[type=text]:focus{
                width: 100%;
            }
            input[type=Password] {
                font-size: 15px;

                width: 40%;
                height: 20%;

                padding: 12px;
                
                margin: 8px 0;

                box-shadow: 2px 2px 5px black;
                
                display: inline-block;
                
                border: 3px;
                border-style: hidden hidden hidden solid;
                border-color: black;
                border-radius: 3px;
                
                box-sizing: border-box;

                transition: width 1s;
            }
            input[type=Password]:focus{
                width: 100%;
            }

            #Cas_Log{
                position: relative;
                left: -22%;


                color: black;
                font-size: 15px;
                margin-top: 10px;
                
                font-weight: 0px;
                transition: font-size 1s,left 0.5s;
            }
            #Cas_Log:hover{
                left: -16%;
                font-size:  20px;
            }

            .res{
                position: relative;
                left: -50%;
            }
            #pix{

                background-image: url('Capas/pix.jpeg');
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;

                border-radius: 40px;

                width: 140px;
                height: 45px;
                
                color: black;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="login">

            <!-- Esse aqui relmente e util pqp ele salva oque tem e manda pra registrar a compra -->
            <form method = 'Post' action = '../php/register2.php'>
                Nome Completo: <br/><input type = 'text' name = 'Nome' id="nome"><br/>
                CPF: <br/><input type = 'text'  name = 'CPF' maxlength="14" id="cpf"><br/>
                Endereço: <br/><input  type = 'text'  name = 'End'><br/>
                Bairro: <br/><input  type = 'text'  name = 'Bair'><br/>
                Cidade: <br/><input  type = 'text'  name = 'Cid'><br/>
                Estado: <br/><input  type = 'text'  name = 'Est' id="estado" maxlength="2"><br/>
                CEP: <br/><input  type = 'text'  name = 'CEP' id="cep" maxlength="9"><br/>
                <div id="pix"></div>
                <button type="submit" class="bot" value = 'salvar' name = 'b1'>Compra</button><br/>
            </form>
            

        </div>
        <script>

            //deixar as informaçoes bonitinhas
            
            document.getElementById("cpf").addEventListener("input", function() {
                let valor = this.value.replace(/\D/g, '');

                valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
                valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

                this.value = valor;
            });
            document.getElementById("cep").addEventListener("input", function() {
                let valor = this.value.replace(/\D/g, '');
                valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
                this.value = valor;
            });
            document.getElementById("estado").addEventListener("input", function() {
                this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '');
            });
        </script>
    </body>
</html>
